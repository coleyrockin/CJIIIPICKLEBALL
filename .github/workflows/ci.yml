name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -f _headers
          test -f robots.txt
          test -f sitemap.xml
          test -f index.html
          test -f css/base.css
          test -f css/components.css
          test -f css/nav.css
          test -f css/hero.css
          test -f css/sections.css
          test -f css/responsive.css
          test -f css/fonts.css
          test -f css/app.css
          test -f scripts/build-css.sh
          test -f fonts/montserrat-latin.woff2
          test -f fonts/open-sans-latin.woff2
          test -f js/main.js
          test -f images/hero-court.jpg
          test -f images/logo.png
          test -f docs/screenshot.jpg
          test -f scripts/check-csp-hashes.js

      - name: Check JavaScript syntax
        run: node --check js/main.js

      - name: Verify css/app.css is in sync with its source files
        run: |
          bash scripts/build-css.sh
          git diff --exit-code css/app.css \
            || { echo "::error::css/app.css is stale — run ./scripts/build-css.sh and commit the result."; exit 1; }

      - name: Check CSP & SRI hashes (JSON-LD + main.js)
        run: node scripts/check-csp-hashes.js

      - name: Check local asset links
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          from urllib.parse import unquote, urlparse

          ROOT = Path.cwd()
          EXTERNAL_SCHEMES = {"http", "https", "mailto", "tel", "data", "javascript"}
          LOCAL_ATTRS = {"href", "src", "poster"}

          class LocalLinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
                  self.blank_links = []

              def handle_starttag(self, tag, attrs):
                  attr_map = dict(attrs)
                  for name, value in attrs:
                      if name in LOCAL_ATTRS and value:
                          self.refs.append(value)
                  if tag == "a" and attr_map.get("target") == "_blank":
                      rel = set((attr_map.get("rel") or "").lower().split())
                      if not {"noopener", "noreferrer"}.issubset(rel):
                          self.blank_links.append(attr_map.get("href", "<missing href>"))

          def local_target(ref, base=ROOT):
              parsed = urlparse(ref)
              if parsed.scheme in EXTERNAL_SCHEMES:
                  return None
              if not parsed.path or parsed.path.startswith("#"):
                  return None
              if parsed.path.startswith("/"):
                  return ROOT / unquote(parsed.path.lstrip("/"))
              return base / unquote(parsed.path)

          parser = LocalLinkParser()
          parser.feed((ROOT / "index.html").read_text(encoding="utf-8"))

          missing = []
          for ref in parser.refs:
              target = local_target(ref)
              if target and not target.exists():
                  missing.append(ref)

          for css_path in (ROOT / "css").glob("*.css"):
              css_text = css_path.read_text(encoding="utf-8")
              for ref in re.findall(r"url\((['\"]?)(.*?)\1\)", css_text):
                  url = ref[1].strip()
                  target = local_target(url, base=ROOT / "css")
                  if target and not target.resolve().exists():
                      missing.append(url)

          if parser.blank_links:
              raise SystemExit("target=_blank links missing noopener noreferrer: " + ", ".join(parser.blank_links))
          if missing:
              raise SystemExit("Missing local references: " + ", ".join(sorted(missing)))
          PY
